const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 600 70');svg.setAttribute('role','img');svg.setAttribute('aria-label',`${agree} agreements and ${disagree} disagreements`);for(const [count,x,color] of [[agree,0,'var(--success, #248261)'],[disagree,comparable.length?600*agree/comparable.length:0,'var(--warning, #ba7522)']]){const rect=document.createElementNS(svg.namespaceURI,'rect');rect.setAttribute('x',x);rect.setAttribute('y',5);rect.setAttribute('height',22);rect.setAttribute('width',comparable.length?600*count/comparable.length:0);rect.setAttribute('fill',color);svg.append(rect)}document.getElementById('chart').append(svg);el('small','Green: agreement · Amber: disagreement',document.getElementById('chart'));
for(const [name,prefix] of [['Recipe agent',''],['AI judge','judge_']]){const cost=results.reduce((s,r)=>s+(r[prefix+'cost']||0),0);const sums=k=>results.reduce((s,r)=>s+(r[prefix+'tokens']?.[k]||0),0);el('p',`${name} — estimated USD $${cost.toFixed(10)} · input ${sums('input_tokens')} · output ${sums('output_tokens')} · total ${sums('total_tokens')} · cached ${sums('cache_read_tokens')} · requests ${sums('requests')}`,document.getElementById('metrics'))}
el('p','Costs cover completed scenarios only and are estimates, not invoice charges.',document.getElementById('metrics'));
for(const r of recipes){const d=el('details',undefined,document.getElementById('recipes'));el('summary',r.name,d);el('pre',JSON.stringify(r,null,2),d)}
let hash=2166136261;const identity=JSON.stringify(results);for(let i=0;i<identity.length;i++){hash^=identity.charCodeAt(i);hash=Math.imul(hash,16777619)}const key='judge-followup-v1:'+hash.toString(16);let stored={},storageWorks=true;try{stored=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){storageWorks=false}
results.forEach((r,i)=>{r.followup_label=stored[i]?.label??r.followup_label??'';r.followup_notes=stored[i]?.notes??r.followup_notes??''});
function status(){document.getElementById('status').textContent=storageWorks?'Original human labels are fixed. Follow-up edits save in this browser; export to keep a portable copy.':'Browser saving unavailable. Export follow-up edits before closing.'}
function save(){try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(results.map((r,i)=>[i,{label:r.followup_label,notes:r.followup_notes}]))))}catch(e){storageWorks=false}status()}
function render(){const root=document.getElementById('rows');root.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),filter=document.getElementById('filter').value;results.forEach((r,i)=>{const a=agreement(r),direction=`${r.human_label}-${r.judge_label}`;if(filter!=='all'&&filter!==a&&filter!==direction)return;if(!`${r.question} ${r.output} ${r.human_notes} ${r.judge_reasoning}`.toLowerCase().includes(q))return;
const card=el('article',undefined,root);card.className=a;el('h2',`${i+1}. ${r.question}`,card);el('p',`${r.category} / ${r.type} · ${a.toUpperCase()}`,card);el('pre',r.output,card);
const panels=el('div',undefined,card);panels.className='panels';for(const [title,label,notes] of [['Your original review',r.human_label||'unlabeled',r.human_notes||'No comments'],['AI judge',r.judge_label,r.judge_reasoning]]){const p=el('section',undefined,panels);p.className='panel';el('h3',`${title}: ${label}`,p);el('pre',notes,p)}
const d=el('details',undefined,card);el('summary','Usage, cost, and evaluation metadata',d);el('pre',JSON.stringify(Object.fromEntries(Object.entries(r).filter(([k])=>!['question','output','human_label','human_notes','judge_label','judge_reasoning','followup_label','followup_notes'].includes(k))),null,2),d);
const l=el('label','Follow-up decision (does not change original labels or agreement)',card),select=el('select',undefined,l);for(const [v,t] of [['','Not reviewed'],['good','Good'],['bad','Bad']]){const o=el('option',t,select);o.value=v}select.value=r.followup_label;select.onchange=()=>{r.followup_label=select.value;save()};const nl=el('label','Follow-up notes',card),notes=el('textarea',undefined,nl);notes.value=r.followup_notes;notes.oninput=()=>{r.followup_notes=notes.value;save()};});status()}
function download(text,type,name){const url=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('json').onclick=()=>download(JSON.stringify(results,null,2),'application/json','judge_comparison_reviewed.json');
document.getElementById('csv').onclick=()=>{const flattened=results.map(r=>{const obj={...r};for(const key of ['tokens','judge_tokens','pricing','judge_pricing']){delete obj[key];for(const [k,v] of Object.entries(r[key]||{}))obj[key+'_'+k]=v}return obj});const fields=[...new Set(flattened.flatMap(Object.keys))];const quote=v=>{let s=String(v??'');if(/^\s*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download('\ufeff'+[fields.map(quote).join(','),...flattened.map(r=>fields.map(k=>quote(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8','judge_comparison_reviewed.csv')};
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;render();
</script></html>
