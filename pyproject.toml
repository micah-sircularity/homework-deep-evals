[project]
name = "homework-deep-evals"
version = "0.1.0"
description = "Recipe assistant evaluation with human and AI judge alignment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "pydantic-ai>=2.64.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
homework-deep-evals = "homework_deep_evals:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
